name: TRX Neural Sync
on:
  schedule:
    - cron: '*/5 * * * *' # Har 5 minute baad auto-run
  workflow_dispatch: # Manual button ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Screenshot mein 20.x use ho rahi hai

      - name: Run Neural Sync
        run: node sync.js # Seedha script chalane ke liye
